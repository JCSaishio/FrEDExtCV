# FrED hub settings - ONE place for every network setting of the hub Pi 5.
# Read by hub_hotspot.sh / start_hub.sh (bash `source`) and by hub.py.
# Format: KEY="value", one per line (bash syntax, no spaces around =).
#
# If you change a value here, change it on the other two machines too:
#   FrED Pi 4:  fred-device-extcv-pi4v7/setup_wifi.sh   (HUB_* / FRED_IP)
#               fred-device-extcv-pi4v7/laptop_link.py  (HUB_* / FRED_HUB_IP)
#   Laptop:     FrEDFiberMeasurewithStreamingv7/fiber_measure.py  (HUB_*)

# --- The hub's WiFi network ---------------------------------------------- #
HUB_SSID="FrED_Hub"
HUB_PASSWORD="fredfiber123"
HUB_IP="192.168.50.1"        # this Pi 5. Relay mode: the laptop connects here
FRED_IP="192.168.50.2"       # fixed address FrED takes on the hub
                             # (setup_wifi.sh hub). Direct mode: the laptop
                             # connects here. .2 - .9 are kept free of DHCP.

# --- Ports ----------------------------------------------------------------- #
LINK_PORT="5005"             # FrED's command port; the relay listens on the
                             # same number on the hub
STATUS_PORT="5006"           # UDP: FrED answers the hub's status pings here

# --- Radio ------------------------------------------------------------------ #
WIFI_COUNTRY="MX"            # 2-letter country code (the hotspot does not
                             # start without one)
BAND="bg"                    # bg = 2.4 GHz (default, proven on the FrED Pi)
                             # a  = 5 GHz (less crowded on campus; the laptop
                             #      and FrED's Pi 4 both support it)
CHANNEL=""                   # empty = automatic. With BAND="a", empty means 36
IFACE="wlan0"                # the Pi 5's built-in WiFi
CON_NAME="FrED_Hub_AP"       # NetworkManager profile name of the hotspot
